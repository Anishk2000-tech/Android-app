name: Android build & device test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APKs with Gradle
        env:
          KEYSTORE_B64: ${{ secrets.WORKDECK_KEYSTORE_B64 }}
          WORKDECK_KS_PASS: ${{ secrets.WORKDECK_KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/workdeck.p12"
            export WORKDECK_KEYSTORE="$RUNNER_TEMP/workdeck.p12"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: JVM logic tests
        run: |
          SDK_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          LAMBDA="$(ls $ANDROID_HOME/build-tools/*/core-lambda-stubs.jar | tail -1)"
          CLASSES=app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
          RJAR="$(find app/build/intermediates -path '*debug*' -name R.jar | head -1)"
          echo "R.jar: $RJAR"
          mkdir -p build/tests
          javac -nowarn -source 8 -target 8 -bootclasspath "$LAMBDA:$SDK_JAR" -cp "$CLASSES:$RJAR" -d build/tests tests/jvm/LogicTest.java
          java -cp "build/tests:$CLASSES:$RJAR" LogicTest

      - uses: actions/upload-artifact@v4
        with:
          name: workdeck-apks
          path: app/build/outputs/apk/**/*.apk

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: workdeck-apks
          path: apks

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash scripts/ci/emulator-test.sh "$(ls apks/debug/*.apk | head -1)" "$(ls release/*.apk 2>/dev/null | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: ci-out/
